
<div class="heading">

    <h1>{{ encabezado }}</h1>

    <p>{{ descripcion }}</p>

</div>

{% include '_buscador_salida.html' %}

{% if viaje %}

<div class="work-grid">

    <section class="panel">

        <div class="panel-heading">

            <h2>Seleccionar asiento</h2>

            <span class="chip">
                {{ viaje.capacidad - ocupados }}
                disponibles
            </span>

        </div>

        {% set seleccionable = true %}

        {% include '_asientos.html' %}

    </section>

    <section class="panel form-panel">

        <h2>Datos del pasajero</h2>

        <form method="post" id="form-operacion">

            <input type="hidden"
                   name="_csrf"
                   value="{{ csrf_token() }}">

            <input type="hidden"
                   name="viaje_id"
                   value="{{ viaje.id }}">

            <div class="field">

                <label for="destino">Destino</label>

                <select name="destino"
                        id="destino"
                        required>

                    <option value="">
                        Selecciona un destino
                    </option>

                    {% for nombre, precio in destinos.items() %}

                    <option value="{{ nombre }}"
                            data-precio="{{ precio }}">

                        {{ nombre }} - ${{ '%.2f'|format(precio) }}

                    </option>

                    {% endfor %}

                </select>

            </div>

            <div class="field">

                <label for="pasajero">
                    Nombre completo
                </label>

                <input type="text"
                       id="pasajero"
                       name="pasajero"
                       minlength="3"
                       maxlength="90"
                       placeholder="Nombre del pasajero"
                       required>

            </div>

            <div class="field">

                <label for="telefono">Teléfono</label>

                <input type="tel"
                       id="telefono"
                       name="telefono"
                       inputmode="numeric"
                       pattern="[0-9]{10}"
                       maxlength="10"
                       placeholder="10 dígitos"
                       required>

            </div>

            <div class="field">

                <label>Asiento seleccionado</label>

                <input type="text"
                       id="asiento-mostrar"
                       readonly
                       placeholder="Selecciona un asiento">

                <input type="hidden"
                       name="asiento"
                       id="asiento"
                       required>

            </div>

            <div class="price-box">

                <span>Precio del boleto</span>

                <strong id="precio-total">
                    $0.00 MXN
                </strong>

            </div>

            <button type="submit"
                    class="btn primary full">
                {{ texto_boton }}
            </button>

        </form>

    </section>

</div>

{% endif %}
