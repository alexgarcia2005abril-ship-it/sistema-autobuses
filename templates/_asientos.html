<div class="seat-area"><div class="bus-head"><span>FRENTE DEL AUTOBÚS</span><span class="steering">◉</span></div><div class="seat-grid">
{% for n in range(1,viaje.capacidad+1) %}
{% set estado=estados.get(n) %}<button type="button" class="seat {% if estado=='VENDIDO' %}sold{% elif estado=='APARTADO' %}reserved{% else %}free{% endif %}" data-asiento="{{n}}" {% if estado or not seleccionable %}disabled{% endif %} title="Asiento {{n}}{% if estado %} - {{estado}}{% endif %}">{{'%02d'|format(n)}}</button>
{% endfor %}</div></div>
<div class="legend"><span><i class="dot green-bg"></i>Disponible</span><span><i class="dot red-bg"></i>Vendido</span><span><i class="dot yellow-bg"></i>Apartado</span>{% if seleccionable %}<span><i class="dot blue-bg"></i>Seleccionado</span>{% endif %}</div>
